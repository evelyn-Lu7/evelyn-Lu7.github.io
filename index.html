<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yijia Lu, a graduate student at Shanghai University of Finance and Economics.">
  <title>Yijia Lu</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #647084;
      --accent: #1f5fa8;
      --paper: #ffffff;
      --background: #f3f6fa;
      --line: #dce3ec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(31, 95, 168, 0.10), transparent 34%),
        var(--background);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(36px, 7vw, 72px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(23, 32, 51, 0.10);
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 10vw, 5.8rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 0.95;
    }

    .rule {
      width: 56px;
      height: 3px;
      margin: 34px 0;
      background: var(--accent);
      border-radius: 999px;
    }

    .intro {
      max-width: 590px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.75;
    }

    .institution {
      color: var(--ink);
      font-weight: 650;
    }

    .contact {
      margin: 38px 0 0;
      padding-top: 26px;
      border-top: 1px solid var(--line);
      font-size: 0.95rem;
    }

    .contact span {
      margin-right: 10px;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      font-weight: 650;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    a:hover,
    a:focus-visible {
      color: #123f73;
    }

    @media (max-width: 520px) {
      main {
        border-radius: 18px;
      }

      .contact span {
        display: block;
        margin: 0 0 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Master&rsquo;s Student · Shanghai</p>
    <h1>Yijia Lu</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="intro">
      I am a master&rsquo;s student at the
      <span class="institution">School of Computer Science and Artificial Intelligence</span>,
      Shanghai University of Finance and Economics.
    </p>
    <p class="contact">
      <span>Email</span>
      <a href="mailto:lu.yijia@stu.sufe.edu.cn">lu.yijia@stu.sufe.edu.cn</a>
    </p>
  </main>
</body>
</html>
